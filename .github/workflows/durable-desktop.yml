name: Durable desktop integration
on:
  pull_request:
    paths:
      - "src/openvarak/runtime/**"
      - "src/openvarak/agents/pydantic_desktop.py"
      - "src/openvarak/tools/**"
      - "src/openvarak/core/config.py"
      - "tests/desktop/**"
      - "pyproject.toml"
      - ".github/workflows/durable-desktop.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: openvarak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VARAK_TEST_POSTGRES_DSN: postgresql://postgres:test-only-password@127.0.0.1:5432/openvarak_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[durable,browser]" pytest pytest-asyncio respx
      - run: python -m pytest tests/desktop tests/tools/test_tool_timeout.py -q
