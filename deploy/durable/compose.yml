# Optional single-host companion services. Run the Python/GPU worker on the host.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: openvarak
      POSTGRES_PASSWORD: ${VARAK_DB_PASSWORD:?Set VARAK_DB_PASSWORD}
      POSTGRES_DB: openvarak
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvarak -d openvarak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: openvarak
      POSTGRES_PWD: ${VARAK_DB_PASSWORD:?Set VARAK_DB_PASSWORD}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "127.0.0.1:7233:7233"
    restart: unless-stopped
volumes:
  postgres-data:
